name: Require Changeset

on:
  pull_request:
    branches:
      - main

jobs:
  require-changeset:
    name: Require Changeset
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch "https://github.com/${{ github.event.pull_request.base.repo.full_name }}" main:main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Skip changeset check
        if: contains(github.event.pull_request.labels.*.name, 'skip-changeset')
        run: echo "PR labeled skip-changeset — no package version bump expected."

      - name: Check for changeset
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
        run: npx changeset status --since=main

  require-changeset-version-packages:
    name: Require Changeset
    if: github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Skip changeset check for Version Packages PR
        run: echo "Version Packages PR — changesets are consumed, not added."
