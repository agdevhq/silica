name: Prepare Dependabot PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: prepare-dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Dependabot PR
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main:main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Sync generated files
        run: |
          npm run scaffold-versions:update
          npm run generated-app-manifest:update

      - name: Add changeset
        env:
          BASE_REF: main
        run: node scripts/dependabot-changeset.mjs

      # Pushing with a deploy key (rather than GITHUB_TOKEN) so the new commit
      # triggers CI and Require Changeset again. The key lives in the Dependabot
      # secrets store, which is the only one visible to Dependabot-triggered runs.
      - name: Commit and push
        env:
          DEPENDABOT_CHANGESET_DEPLOY_KEY: ${{ secrets.DEPENDABOT_CHANGESET_DEPLOY_KEY }}
        run: |
          git add -u
          git add .changeset
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare Dependabot PR: changeset and generated files"

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPENDABOT_CHANGESET_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git push "git@github.com:${{ github.repository }}.git" "HEAD:${{ github.head_ref }}"
