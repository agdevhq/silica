version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dependencies:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # @core-ai ships breaking API changes in 0.x minor releases. Patch bumps
      # still arrive automatically; minor bumps are done deliberately.
      - dependency-name: "@core-ai/*"
        update-types:
          - "version-update:semver-minor"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # changesets/action v2 requires Changesets CLI v3 and renames its inputs.
      # Bump it together with @changesets/cli.
      - dependency-name: changesets/action
        update-types:
          - "version-update:semver-major"
    groups:
      github-actions:
        patterns:
          - "*"
