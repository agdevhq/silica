version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dependencies:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # @core-ai ships breaking API changes in 0.x minor releases. Patch bumps
      # still arrive automatically; minor bumps are done deliberately.
      - dependency-name: "@core-ai/*"
        update-types:
          - "version-update:semver-minor"
      # TypeScript 7 (native compiler) no longer exposes the JS compiler API
      # that tsup's dts build (rollup-plugin-dts) relies on, so every package
      # build fails. Revisit once tsup supports it or we move off tsup.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
